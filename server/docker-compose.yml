version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: scrimgg_postgres
    environment:
      POSTGRES_DB: scrimgg
      POSTGRES_USER: scrimgg
      POSTGRES_PASSWORD: scrimgg_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrimgg"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey (Redis-compatible)
  valkey:
    image: valkey/valkey:7-alpine
    container_name: scrimgg_valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django ASGI Server (Daphne)
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrimgg_django
    command: pipenv run daphne -b 0.0.0.0 -p 8000 scrimgg.asgi:application
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://scrimgg:scrimgg_dev_password@postgres:5432/scrimgg
      - REDIS_URL=redis://valkey:6379/0
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
      - CHANNEL_LAYERS_REDIS=redis://valkey:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrimgg_celery_worker
    command: pipenv run celery -A scrimgg worker --loglevel=info --pool=gevent -Q celery,matchmaking,cleanup
    volumes:
      - .:/app
      - logs_volume:/app/logs
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://scrimgg:scrimgg_dev_password@postgres:5432/scrimgg
      - REDIS_URL=redis://valkey:6379/0
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
    depends_on:
      - postgres
      - valkey
      - django
    restart: unless-stopped

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrimgg_celery_beat
    command: pipenv run celery -A scrimgg beat --loglevel=info
    volumes:
      - .:/app
      - logs_volume:/app/logs
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://scrimgg:scrimgg_dev_password@postgres:5432/scrimgg
      - REDIS_URL=redis://valkey:6379/0
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
    depends_on:
      - postgres
      - valkey
      - django
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  static_volume:
  media_volume:
  logs_volume:


