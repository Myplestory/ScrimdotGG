<!DOCTYPE html>
<html lang="en" style="background: transparent;">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Scrim.GG - Competitive Valorant Matchmaking Platform"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Rajdhani Font for Scrim.GG branding -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <title>Scrim.GG</title>
    
    <style>
      /* Transparent background - no white flash */
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      
      /* Root element styling */
      #root {
        background: transparent;
        min-height: 100vh;
      }
      
      /* Initial loader (before React loads) */
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease-out;
      }
      
      .initial-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      
      /* Removed spinner - just transparent background */
    </style>
  </head>
  <body style="background: transparent; margin: 0; padding: 0;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Initial loader (shows before React) -->
    <div id="initial-loader" class="initial-loader"></div>
    
    <div id="root"></div>
